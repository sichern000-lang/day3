<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        @font-face {
            font-family: 'Cafe24SurroundAir';
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
        :root {
            --sky: #dbe3fc;      /* 배경: 연한 페리윙클 */
            --blue: #1f1fe6;     /* 포인트 글자 */
            --butter: #fbeaa0;   /* 버터색 */
            --butter-deep: #f6dc72;
            --ink: #111;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; display: flex; background: var(--sky); color: var(--ink);
            font-family: "Cafe24SurroundAir", system-ui, sans-serif;
        }
        #side { width: 400px; padding: 28px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        #mapwrap { flex: 1; padding: 24px 24px 24px 0; }
        #map { height: 100%; border: 2px solid var(--ink); border-radius: 4px; }

        /* 헤더: 포스터처럼 큰 파란 글자 + 버터색 램프갓 */
        header { text-align: center; }
        .eyebrow { color: var(--blue); font-size: 15px; font-weight: 500; letter-spacing: .02em; }
        .shade {
            margin: 8px auto 0; width: 230px; height: 84px; background: var(--butter);
            clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700;
        }
        .shade-line { height: 2px; background: var(--ink); width: 190px; margin: 0 auto; }
        h1 { margin: 10px 0 0; font-size: 26px; font-weight: 500; color: var(--blue); letter-spacing: -.01em; }

        form { display: flex; gap: 8px; }
        input {
            flex: 1; min-width: 0; padding: 12px 14px; font: inherit; font-size: 15px;
            background: #fff; border: 2px solid var(--ink); border-radius: 4px; outline: none;
        }
        input:focus { box-shadow: 4px 4px 0 var(--butter-deep); }
        button {
            font: inherit; font-weight: 700; padding: 0 18px; cursor: pointer;
            background: var(--butter); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px;
        }
        button:hover { background: var(--butter-deep); }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chips button { padding: 5px 12px; font-size: 13px; font-weight: 500; background: transparent; color: var(--blue); border-color: var(--blue); border-radius: 999px; }
        .chips button:hover { background: var(--blue); color: #fff; }

        .card { background: var(--butter); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
        .card[hidden] { display: none; }
        .card h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--blue); letter-spacing: .03em; }
        #weather { background: #fff; font-size: 17px; font-weight: 500; }
        #steps { background: transparent; border: 1px dashed var(--ink); font-size: 12px; color: #444; font-family: ui-monospace, monospace; }
        #spots { display: flex; flex-direction: column; gap: 8px; }
        .spot { text-align: left; padding: 10px 14px; font-weight: 500; background: #fff; display: flex; justify-content: space-between; gap: 8px; }
        .spot small { font-weight: 400; color: #555; }
        .tag { color: var(--blue); font-size: 12px; white-space: nowrap; }

        .pin {
            width: 22px; height: 22px; border-radius: 50%; background: var(--butter); border: 2px solid var(--ink);
            display: flex; align-items: center; justify-content: center;
        }
        .pin::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
        .leaflet-popup-content-wrapper { border-radius: 4px; border: 2px solid var(--ink); box-shadow: none; }

        @media (max-width: 800px) {
            body { flex-direction: column-reverse; height: auto; min-height: 100vh; }
            #side { width: auto; padding: 20px 16px; }
            #mapwrap { height: 55vh; padding: 16px 16px 0; }
        }
    </style>
</head>
<body>
    <div id="side">
        <header>
            <div class="eyebrow">Jeju Trip Agent</div>
            <div class="shade">오늘의 제주</div>
            <div class="shade-line"></div>
            <h1>날씨 따라 고르는 여행지</h1>
        </header>
        <form id="form">
            <input id="q" placeholder="예) 동쪽에서 오늘 갈 만한 곳 추천해줘" autofocus>
            <button>추천</button>
        </form>
        <div class="chips">
            <button type="button" data-q="동쪽 관광지">동쪽</button>
            <button type="button" data-q="서쪽 관광지">서쪽</button>
            <button type="button" data-q="서귀포 관광지">서귀포</button>
            <button type="button" data-q="제주시 관광지">제주시</button>
        </div>
        <div id="weather" class="card" hidden></div>
        <div id="reply" class="card" hidden></div>
        <div id="spots"></div>
        <div id="steps" class="card" hidden></div>
    </div>
    <div id="mapwrap"><div id="map"></div></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | 날씨: OpenWeather"
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);
        const pin = L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [22, 22], popupAnchor: [0, -12] });
        const $ = (id) => document.getElementById(id);
        const show = (id, text) => { $(id).hidden = !text; $(id).textContent = text || ""; };

        document.querySelectorAll(".chips button").forEach((b) => {
            b.onclick = () => { $("q").value = b.dataset.q; $("form").requestSubmit(); };
        });

        $("form").onsubmit = async (e) => {
            e.preventDefault();
            layer.clearLayers(); // 이전 검색 결과는 새 검색 시작 즉시 지운다
            $("spots").innerHTML = "";
            show("steps", ""); show("weather", ""); show("reply", "에이전트가 날씨와 장소를 찾는 중...");
            let data;
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message: $("q").value })
                });
                const text = await res.text();
                try { data = JSON.parse(text); }
                catch { data = { error: `서버 응답 오류 (${res.status}): ${text.slice(0, 200)}` }; }
            } catch (err) {
                data = { error: "요청 실패: " + err.message };
            }
            if (data.error) { show("reply", data.error); return; }

            show("steps", data.steps.length ? "도구 호출\n" + data.steps.join("\n") : "");
            show("weather", data.weather.map((w) =>
                `${w.area} · ${w.weather} · ${w.temperature_c}°C · 12시간 내 강수확률 ${w.rain_probability_percent}%`).join("\n"));
            show("reply", data.reply);

            for (const s of data.spots) {
                const m = L.marker([s.lat, s.lon], { icon: pin }).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.areas.join(", ")} · ${s.indoor ? "실내" : "야외"}<br>${s.desc}`);
                const b = document.createElement("button");
                b.className = "spot";
                b.innerHTML = `<span>${s.name}<br><small>${s.desc}</small></span><span class="tag">${s.indoor ? "실내" : "야외"}</span>`;
                b.onclick = () => { map.flyTo([s.lat, s.lon], 12); m.openPopup(); };
                $("spots").appendChild(b);
            }
            if (data.spots.length) map.fitBounds(data.spots.map((s) => [s.lat, s.lon]), { padding: [40, 40] });
        };
    </script>
</body>
</html>
