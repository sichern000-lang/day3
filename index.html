<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        @font-face {
            font-family: 'Cafe24SurroundAir';
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
        :root {
            --sky: #f1f4ff;      /* 배경: 더 밝은 페리윙클 */
            --butter: #fbeaa0;   /* 버터색 */
            --butter-deep: #f6dc72;
            --ink: #111;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--sky); color: var(--ink);
            font-family: "Cafe24SurroundAir", system-ui, sans-serif;
        }
        .page { max-width: 1080px; margin: 0 auto; padding: 32px 20px 40px; }

        /* 상단: 타이틀 + 검색창 */
        header { text-align: center; }
        .eyebrow { font-size: 15px; letter-spacing: .04em; }
        .oval {
            margin: 10px auto 8px; width: 260px; height: 96px; border-radius: 50%;
            background: var(--butter); border: 2px solid var(--ink);
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        h1 { margin: 0 0 18px; font-size: 26px; font-weight: normal; letter-spacing: -.01em; }
        form { display: flex; gap: 8px; max-width: 620px; margin: 0 auto; }
        input {
            flex: 1; min-width: 0; padding: 12px 14px; font: inherit; font-size: 15px;
            background: #fff; border: 2px solid var(--ink); border-radius: 4px; outline: none;
        }
        input:focus { box-shadow: 4px 4px 0 var(--butter-deep); }
        button {
            font: inherit; padding: 0 18px; cursor: pointer;
            background: var(--butter); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px;
        }
        button:hover { background: var(--butter-deep); }
        .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .chips button { padding: 5px 14px; font-size: 13px; background: transparent; border-radius: 999px; }
        .chips button:hover { background: var(--ink); color: #fff; }

        /* 본문: 왼쪽 결과 + 오른쪽 지도(작게, 가운데) */
        .stage { display: grid; grid-template-columns: 340px 1fr; gap: 20px; margin-top: 28px; align-items: start; }
        #side { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding: 2px; }
        #map { height: 520px; border: 2px solid var(--ink); border-radius: 4px; }
        .empty { font-size: 14px; color: #555; padding: 14px 4px; }

        .card { background: var(--butter); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
        .card[hidden] { display: none; }
        #weather { background: #fff; }
        #steps { background: transparent; border: 1px dashed var(--ink); font-size: 12px; color: #444; font-family: ui-monospace, monospace; }
        #spots { display: flex; flex-direction: column; gap: 8px; }
        .spot { text-align: left; padding: 10px 14px; background: #fff; display: flex; justify-content: space-between; gap: 8px; }
        .spot small { color: #555; }
        .tag { font-size: 12px; white-space: nowrap; }

        .pin {
            width: 22px; height: 22px; border-radius: 50%; background: var(--butter); border: 2px solid var(--ink);
            display: flex; align-items: center; justify-content: center;
        }
        .pin::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
        .leaflet-popup-content-wrapper { border-radius: 4px; border: 2px solid var(--ink); box-shadow: none; }

        @media (max-width: 800px) {
            .stage { grid-template-columns: 1fr; }
            #side { max-height: none; }
            #map { height: 380px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="eyebrow">Jeju Trip Agent</div>
            <div class="oval">오늘의 제주</div>
            <h1>날씨 따라 고르는 여행지</h1>
            <form id="form">
                <input id="q" placeholder="예) 동쪽에서 오늘 갈 만한 곳 추천해줘" autofocus>
                <button>추천</button>
            </form>
            <div class="chips">
                <button type="button" data-q="동쪽 관광지">동쪽</button>
                <button type="button" data-q="서쪽 관광지">서쪽</button>
                <button type="button" data-q="서귀포 관광지">서귀포</button>
                <button type="button" data-q="제주시 관광지">제주시</button>
            </div>
        </header>
        <div class="stage">
            <div id="side">
                <div id="empty" class="empty">지역을 고르거나 문장을 입력하면 추천 결과가 여기에 나와요.</div>
                <div id="weather" class="card" hidden></div>
                <div id="reply" class="card" hidden></div>
                <div id="spots"></div>
                <div id="steps" class="card" hidden></div>
            </div>
            <div id="map"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | 날씨: OpenWeather"
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);
        const pin = L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [22, 22], popupAnchor: [0, -12] });
        const $ = (id) => document.getElementById(id);
        const show = (id, text) => { $(id).hidden = !text; $(id).textContent = text || ""; };

        document.querySelectorAll(".chips button").forEach((b) => {
            b.onclick = () => { $("q").value = b.dataset.q; $("form").requestSubmit(); };
        });

        $("form").onsubmit = async (e) => {
            e.preventDefault();
            layer.clearLayers(); // 이전 검색 결과는 새 검색 시작 즉시 지운다
            $("empty").hidden = true;
            $("spots").innerHTML = "";
            show("steps", ""); show("weather", ""); show("reply", "에이전트가 날씨와 장소를 찾는 중...");
            let data;
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message: $("q").value })
                });
                const text = await res.text();
                try { data = JSON.parse(text); }
                catch { data = { error: `서버 응답 오류 (${res.status}): ${text.slice(0, 200)}` }; }
            } catch (err) {
                data = { error: "요청 실패: " + err.message };
            }
            if (data.error) { show("reply", data.error); return; }

            show("steps", data.steps.length ? "도구 호출\n" + data.steps.join("\n") : "");
            show("weather", data.weather.map((w) =>
                `${w.area} · ${w.weather} · ${w.temperature_c}°C · 12시간 내 강수확률 ${w.rain_probability_percent}%`).join("\n"));
            show("reply", data.reply);

            for (const s of data.spots) {
                const m = L.marker([s.lat, s.lon], { icon: pin }).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.areas.join(", ")} · ${s.indoor ? "실내" : "야외"}<br>${s.desc}`);
                const b = document.createElement("button");
                b.className = "spot";
                b.innerHTML = `<span>${s.name}<br><small>${s.desc}</small></span><span class="tag">${s.indoor ? "실내" : "야외"}</span>`;
                b.onclick = () => { map.flyTo([s.lat, s.lon], 12); m.openPopup(); };
                $("spots").appendChild(b);
            }
            if (data.spots.length) map.fitBounds(data.spots.map((s) => [s.lat, s.lon]), { padding: [40, 40] });
        };
    </script>
</body>
</html>
