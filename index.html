<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
        #side { width: 360px; padding: 16px; overflow-y: auto; box-sizing: border-box; border-right: 1px solid #ddd; }
        #map { flex: 1; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 8px; }
        .box { margin-top: 12px; padding: 10px; border-radius: 8px; background: #f3f6fb; font-size: 14px; white-space: pre-wrap; }
        .steps { font-size: 12px; color: #555; font-family: monospace; }
        @media (max-width: 700px) { body { flex-direction: column-reverse; } #side { width: auto; height: 45vh; } }
    </style>
</head>
<body>
    <div id="side">
        <h1>🏝️ 제주 여행 추천 에이전트</h1>
        <form id="form">
            <input id="q" placeholder="예) 동쪽에서 오늘 갈 만한 곳 추천해줘" autofocus>
            <button>추천</button>
        </form>
        <div id="steps" class="box steps" hidden></div>
        <div id="weather" class="box" hidden></div>
        <div id="reply" class="box" hidden></div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | 날씨: Open-Meteo"
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);
        const $ = (id) => document.getElementById(id);
        const show = (id, text) => { $(id).hidden = !text; $(id).textContent = text || ""; };

        $("form").onsubmit = async (e) => {
            e.preventDefault();
            layer.clearLayers(); // 이전 검색 결과는 새 검색 시작 즉시 지운다
            show("steps", ""); show("weather", ""); show("reply", "에이전트가 날씨와 장소를 찾는 중...");
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ message: $("q").value })
            });
            const data = await res.json();
            if (data.error) { show("reply", data.error); return; }

            show("steps", data.steps.length ? "🔧 도구 호출\n" + data.steps.join("\n") : "");
            show("weather", data.weather.map((w) =>
                `🌤️ ${w.area}: ${w.weather}, ${w.temperature_c}°C, 12시간 내 강수확률 ${w.rain_probability_percent}%`).join("\n"));
            show("reply", data.reply);

            for (const s of data.spots) {
                L.marker([s.lat, s.lon]).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.areas.join(", ")} · ${s.indoor ? "실내" : "야외"}<br>${s.desc}`);
            }
            if (data.spots.length) map.fitBounds(data.spots.map((s) => [s.lat, s.lon]), { padding: [40, 40] });
        };
    </script>
</body>
</html>
